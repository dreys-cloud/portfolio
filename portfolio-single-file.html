      function slugify(value) {
        return value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }

                  <p class="org">${escapeHtml(item.org)}</p>
                  <p>${escapeHtml(item.detail)}</p>
                </div>
              </div>`,
          )
          .join('')

                  <p class="org">${escapeHtml(item.org)}</p>
                  <p>${escapeHtml(item.detail)}</p>

        const url = URL.createObjectURL(blob)

        document.body.appendChild(link)
        link.click()

        setTimeout(() => URL.revokeObjectURL(url), 1500)

      /** Reveals an element once it scrolls into view. */
      function useInView(options, once) {
        options = options || { threshold: 0.2 }
        once = once === undefined ? true : once
        const ref = React.useRef(null)
        const [inView, setInView] = React.useState(false)

        React.useEffect(() => {
          const el = ref.current
          if (!el || typeof IntersectionObserver === 'undefined') {
            setInView(true)
            return
          }
          const observer = new IntersectionObserver((entries) => {
            const [entry] = entries
            if (entry.isIntersecting) {
              setInView(true)
              if (once) observer.unobserve(entry.target)
            } else if (!once) {
              setInView(false)
            }
          }, options)
          observer.observe(el)
          return () => observer.disconnect()
        }, [once])

        return [ref, inView]
      }

      /** Tracks which section id is currently on screen. */
      function useScrollSpy(ids, offset) {
        offset = offset === undefined ? 140 : offset
        const [active, setActive] = React.useState(ids[0])

        React.useEffect(() => {
          const update = () => {
            const line = window.scrollY + offset
            let current = ids[0]
            for (const id of ids) {
              const el = document.getElementById(id)
              if (el && el.offsetTop <= line) current = id
            }
            const bottomReached =
              window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8
            if (bottomReached) current = ids[ids.length - 1]
            setActive(current)
          }
          update()
          window.addEventListener('scroll', update, { passive: true })
          window.addEventListener('resize', update)
          return () => {
            window.removeEventListener('scroll', update)
            window.removeEventListener('resize', update)
          }
        }, [ids, offset])

        return active
      }

      function Hero() {
        const roles = profile.roles
        const [text, setText] = React.useState('')
        const [deleting, setDeleting] = React.useState(false)
        const [index, setIndex] = React.useState(0)

        React.useEffect(() => {
          const current = roles[index % roles.length]
          let delay = deleting ? 40 : 85
          if (!deleting && text === current) delay = 1500

          const timer = setTimeout(() => {
            if (!deleting) {
              if (text === current) {
                setDeleting(true)
                return
              }
              setText(current.slice(0, text.length + 1))
            } else {
              if (text === '') {
                setDeleting(false)
                setIndex((i) => (i + 1) % roles.length)
                return
              }
              setText(current.slice(0, text.length - 1))
            }
          }, delay)

          return () => clearTimeout(timer)
        }, [text, deleting, index, roles])

      /* ======================================================================
       *  CONTACT
       * ==================================================================== */

      const EMPTY_FORM = { name: '', email: '', subject: '', message: '' }
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/

      function validateForm(values) {
        const errors = {}
        if (!values.name.trim()) errors.name = 'Please enter your name.'
        else if (values.name.trim().length < 2) errors.name = 'Your name is a little too short.'

        if (!values.email.trim()) errors.email = 'Please enter your email address.'
        else if (!EMAIL_RE.test(values.email.trim())) errors.email = 'That does not look like a valid email address.'

        if (!values.subject) errors.subject = 'Please choose a subject.'

        if (!values.message.trim()) errors.message = 'Please write a message.'
        else if (values.message.trim().length < 20)
          errors.message = 'Please write at least 20 characters (' + values.message.trim().length + '/20).'
        else if (values.message.length > 600) errors.message = 'Please keep your message under 600 characters.'

        return errors
      }

      function Contact() {
        const [values, setValues] = React.useState(EMPTY_FORM)
        const [errors, setErrors] = React.useState({})
        const [touched, setTouched] = React.useState({})
        const [status, setStatus] = React.useState('idle') // idle | sending | success | error
        const [submitted, setSubmitted] = React.useState(null)
        const timerRef = React.useRef(null)

        React.useEffect(() => () => clearTimeout(timerRef.current), [])

        const handleChange = (event) => {
          const { name, value } = event.target
          setValues((prev) => ({ ...prev, [name]: value }))
          setErrors((prev) => {
            if (!prev[name]) return prev
            const next = { ...prev }
            delete next[name]
            return next
          })
        }

        const handleBlur = (event) => {
          const { name } = event.target
          setTouched((prev) => ({ ...prev, [name]: true }))
          const fieldErrors = validateForm(values)
          setErrors((prev) => {
            const next = { ...prev }
            if (fieldErrors[name]) next[name] = fieldErrors[name]
            else delete next[name]
            return next
          })
        }

        const handleSubmit = (event) => {
          event.preventDefault()
          const fieldErrors = validateForm(values)
          setErrors(fieldErrors)
          setTouched({ name: true, email: true, subject: true, message: true })

          if (Object.keys(fieldErrors).length > 0) {
            setStatus('error')
            return
          }

          setStatus('sending')
          timerRef.current = setTimeout(() => {
            try {
              const key = 'portfolio-messages'
              const saved = JSON.parse(window.localStorage.getItem(key) || '[]')
              saved.push({ ...values, at: new Date().toISOString() })
              window.localStorage.setItem(key, JSON.stringify(saved))
            } catch (e) {
              /* storage is optional — ignore failures */
            }
            setSubmitted(values.name.trim().split(' ')[0])
            setValues(EMPTY_FORM)
            setTouched({})
            setErrors({})
            setStatus('success')
          }, 1200)
        }

        const resetForm = () => {
          clearTimeout(timerRef.current)
          setValues(EMPTY_FORM)
          setErrors({})
          setTouched({})
          setStatus('idle')
          setSubmitted(null)
        }

        const showError = (field) => (touched[field] && errors[field] ? errors[field] : null)
        const messageLength = values.message.length

        return (
          <section id="contact" className="section">
            <div className="container-page">
              <SectionHeading eyebrow="Contact Information" title="Get in touch" description={contact.blurb} />

              <div className="grid gap-8 lg:grid-cols-[0.85fr_1.15fr]">
                <div className="space-y-4">
                  {contact.details.map((detail) => {
                    const Wrapper = detail.href ? 'a' : 'div'
                    return (
                      <Wrapper
                        key={detail.label}
                        {...(detail.href
                          ? {
                              href: detail.href,
                              className:
                                'card card-hover flex items-center gap-4 p-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500',
                            }
                          : { className: 'card flex items-center gap-4 p-4' })}
                      >
                        <span className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-indigo-100 text-indigo-600 dark:bg-indigo-500/15 dark:text-indigo-300">
                          <Icon name={detail.icon} className="h-5 w-5" />
                        </span>
                        <div className="min-w-0">
                          <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                            {detail.label}
                          </p>
                          <p className="truncate text-sm font-medium text-slate-800 dark:text-slate-200">
                            {detail.value}
                          </p>
                        </div>
                      </Wrapper>
                    )
                  })}

                  <div className="card p-5">
                    <p className="text-sm font-semibold text-slate-800 dark:text-slate-100">Follow my work</p>
                    <p className="mt-1 text-xs text-slate-500 dark:text-slate-400">
                      I post school projects and experiments on these platforms.
                    </p>
                    <ul className="mt-4 flex flex-wrap gap-2">
                      {socials.map((social) => (
                        <li key={social.label}>
                          <a
                            href={social.url}
                            target={social.url.startsWith('http') ? '_blank' : undefined}
                            rel={social.url.startsWith('http') ? 'noreferrer noopener' : undefined}
                            className="btn-icon"
                            aria-label={social.label}
                            title={social.label}
                          >
                            <Icon name={social.icon} className="h-5 w-5" />
                          </a>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 dark:border-emerald-500/25 dark:bg-emerald-500/10">
                    <div className="flex items-center gap-2">
                      <span className="relative flex h-2.5 w-2.5">
                        <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75" />
                        <span className="relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500" />
                      </span>
                      <p className="text-sm font-semibold text-emerald-800 dark:text-emerald-200">
                        Currently available
                      </p>
                    </div>
                    <p className="mt-1.5 text-xs leading-relaxed text-emerald-700 dark:text-emerald-300/80">
                      {profile.availability}. I usually reply within one working day.
                    </p>
                  </div>
                </div>

                <div className="card p-6 sm:p-8">
                  {status === 'success' ? (
                    <div className="flex animate-pop-in flex-col items-center py-10 text-center">
                      <span className="flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-400">
                        <CheckIcon className="h-8 w-8" />
                      </span>
                      <h3 className="mt-5 text-xl font-bold text-slate-900 dark:text-white">
                        Message sent{submitted ? ', ' + submitted : ''}!
                      </h3>
                      <p className="mt-2 max-w-sm text-sm text-slate-600 dark:text-slate-400">
                        Thank you for reaching out. Your message has been recorded and I will get back to you at the
                        email address you provided.
                      </p>
                      <button type="button" onClick={resetForm} className="btn-primary mt-6">
                        Send another message
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleSubmit} noValidate className="space-y-5">
                      <div className="grid gap-5 sm:grid-cols-2">
                        <div>
                          <label htmlFor="name" className="label">
                            Full name <span className="text-rose-500">*</span>
                          </label>
                          <input
                            id="name"
                            name="name"
                            type="text"
                            autoComplete="name"
                            value={values.name}
                            onChange={handleChange}
                            onBlur={handleBlur}
                            placeholder="Your full name"
                            aria-invalid={Boolean(showError('name'))}
                            aria-describedby={showError('name') ? 'name-error' : undefined}
                            className={'field ' + (showError('name') ? 'field-error' : '')}
                          />
                          {showError('name') && (
                            <p id="name-error" className="mt-1.5 flex items-center gap-1.5 text-xs font-medium text-rose-500">
                              <AlertIcon className="h-3.5 w-3.5" />
                              {showError('name')}
                            </p>
                          )}
                        </div>

                        <div>
                          <label htmlFor="email" className="label">
                            Email address <span className="text-rose-500">*</span>
                          </label>
                          <input
                            id="email"
                            name="email"
                            type="email"
                            autoComplete="email"
                            value={values.email}
                            onChange={handleChange}
                            onBlur={handleBlur}
                            placeholder="you@example.com"
                            aria-invalid={Boolean(showError('email'))}
                            aria-describedby={showError('email') ? 'email-error' : undefined}
                            className={'field ' + (showError('email') ? 'field-error' : '')}
                          />
                          {showError('email') && (
                            <p id="email-error" className="mt-1.5 flex items-center gap-1.5 text-xs font-medium text-rose-500">
                              <AlertIcon className="h-3.5 w-3.5" />
                              {showError('email')}
                            </p>
                          )}
                        </div>
                      </div>

                      <div>
                        <label htmlFor="subject" className="label">
                          Subject <span className="text-rose-500">*</span>
                        </label>
                        <select
                          id="subject"
                          name="subject"
                          value={values.subject}
                          onChange={handleChange}
                          onBlur={handleBlur}
                          aria-invalid={Boolean(showError('subject'))}
                          aria-describedby={showError('subject') ? 'subject-error' : undefined}
                          className={
                            'field ' +
                            (showError('subject') ? 'field-error ' : '') +
                            (values.subject ? '' : 'text-slate-400 dark:text-slate-500')
                          }
                        >
                          <option value="">Choose a topic…</option>
                          {contact.subjects.map((subject) => (
                            <option key={subject} value={subject}>
                              {subject}
                            </option>
                          ))}
                        </select>
                        {showError('subject') && (
                          <p id="subject-error" className="mt-1.5 flex items-center gap-1.5 text-xs font-medium text-rose-500">
                            <AlertIcon className="h-3.5 w-3.5" />
                            {showError('subject')}
                          </p>
                        )}
                      </div>

                      <div>
                        <div className="flex items-baseline justify-between">
                          <label htmlFor="message" className="label">
                            Message <span className="text-rose-500">*</span>
                          </label>
                          <span
                            className={
                              'text-xs tabular-nums ' +
                              (messageLength > 600
                                ? 'font-semibold text-rose-500'
                                : 'text-slate-400 dark:text-slate-500')
                            }
                          >
                            {messageLength}/600
                          </span>
                        </div>
                        <textarea
                          id="message"
                          name="message"
                          rows={6}
                          value={values.message}
                          onChange={handleChange}
                          onBlur={handleBlur}
                          placeholder="Tell me a little about your project, question, or opportunity…"
                          aria-invalid={Boolean(showError('message'))}
                          aria-describedby={showError('message') ? 'message-error' : undefined}
                          className={'field resize-y ' + (showError('message') ? 'field-error' : '')}
                        />
                        {showError('message') && (
                          <p id="message-error" className="mt-1.5 flex items-center gap-1.5 text-xs font-medium text-rose-500">
                            <AlertIcon className="h-3.5 w-3.5" />
                            {showError('message')}
                          </p>
                        )}
                      </div>

                      {status === 'error' && (
                        <div
                          role="alert"
                          className="flex items-start gap-2.5 rounded-xl border border-rose-200 bg-rose-50 p-3.5 text-sm text-rose-700 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300"
                        >
                          <AlertIcon className="mt-0.5 h-4 w-4 shrink-0" />
                          <span>Please fix the highlighted fields before sending your message.</span>
                        </div>
                      )}

                      <div className="flex flex-wrap items-center gap-4 pt-1">
                        <button type="submit" disabled={status === 'sending'} className="btn-primary min-w-[160px]">
                          {status === 'sending' ? (
                            <>
                              <SpinnerIcon className="h-4 w-4" />
                              Sending…
                            </>
                          ) : (
                            <>
                              <SendIcon className="h-4 w-4" />
                              Send message
                            </>
                          )}
                        </button>
                        <p className="text-xs text-slate-400 dark:text-slate-500">
                          Fields marked <span className="text-rose-500">*</span> are required.
                        </p>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            </div>
          </section>
        )
      }

          <footer className="border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-950">
            <div className="container-page py-12">
              <div className="grid gap-10 sm:grid-cols-2 lg:grid-cols-4">
                <div className="lg:col-span-2">
                  <div className="flex items-center gap-2.5">
                    <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-sm font-bold text-white">
                      {profile.monogram}
                    </span>
                    <span className="text-sm font-semibold text-slate-800 dark:text-slate-100">{profile.name}</span>
                  </div>
                  <p className="mt-4 max-w-sm text-sm leading-relaxed text-slate-500 dark:text-slate-400">
                    {profile.tagline}
                  </p>
                  <ul className="mt-5 flex flex-wrap gap-2">
                    {socials.map((social) => (
                      <li key={social.label}>
                        <a
                          href={social.url}
                          target={social.url.startsWith('http') ? '_blank' : undefined}
                          rel={social.url.startsWith('http') ? 'noreferrer noopener' : undefined}
                          className="btn-icon"
                          aria-label={social.label}
                          title={social.label}
                        >
                          <Icon name={social.icon} className="h-4 w-4" />
                        </a>
                      </li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h3 className="text-xs font-semibold uppercase tracking-[0.16em] text-slate-400 dark:text-slate-500">
                    Sections
                  </h3>
                  <ul className="mt-4 space-y-2.5">
                    {navigation.map((link) => (
                      <li key={link.id}>
                        <a

                  </h3>
                  <ul className="mt-4 space-y-3">
                    <li>
                      <a
                        href={'mailto:' + profile.email}

                      >

                        <span className="truncate">{profile.email}</span>

                  <ArrowUpIcon className="h-3.5 w-3.5" />

      function BackToTop() {
        const [visible, setVisible] = React.useState(false)

        React.useEffect(() => {
          const onScroll = () => setVisible(window.scrollY > 600)
          onScroll()
          window.addEventListener('scroll', onScroll, { passive: true })
          return () => window.removeEventListener('scroll', onScroll)
        }, [])

        return (
          <button
            type="button"
            onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
            aria-label="Back to top"
            className={
              'fixed bottom-6 right-6 z-40 flex h-11 w-11 items-center justify-center rounded-full bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition-all duration-300 hover:-translate-y-0.5 hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950 ' +
              (visible ? 'translate-y-0 opacity-100' : 'pointer-events-none translate-y-4 opacity-0')
            }
          >
            <ArrowUpIcon className="h-5 w-5" />
          </button>
        )
      }

      /* ======================================================================
       *  APP ROOT
       * ==================================================================== */

      const SECTION_IDS = navigation.map((item) => item.id)
      const THEME_KEY = 'portfolio-theme'

      function App() {
        const [dark, setDark] = React.useState(() => {
          const stored = window.localStorage.getItem(THEME_KEY)
          if (stored) return stored === 'dark'
          return window.matchMedia('(prefers-color-scheme: dark)').matches
        })

        React.useEffect(() => {
          document.documentElement.classList.toggle('dark', dark)
          window.localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light')
        }, [dark])

        const toggleTheme = React.useCallback(() => setDark((value) => !value), [])
        const activeSection = useScrollSpy(SECTION_IDS)

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-200">
            <a
              href="#home"
              className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-indigo-600 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white"
            >

            <Navbar

            <main>

        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
